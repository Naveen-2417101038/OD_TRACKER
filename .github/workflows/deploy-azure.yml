name: Build and Deploy OD Tracker to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install frontend dependencies
        run: |
          npm --prefix frontend ci

      - name: Build React frontend
        run: |
          npm --prefix frontend run build

      - name: Verify frontend build assets
        run: |
          if [ ! -f "frontend/dist/index.html" ]; then
            echo "::error::Build verification failed: frontend/dist/index.html was not generated."
            exit 1
          fi
          echo "Frontend build successfully verified at frontend/dist/index.html"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies for SQL Server ODBC
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Clean non-runtime assets for lean deployment
        run: |
          rm -rf frontend/node_modules
          rm -rf node_modules

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: Rajalakshmi-ODTracker
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
